name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DATA_ADAPTER: local
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      # 플랜 완료 기준 4번: supabase 어댑터로도 빌드가 성공해야 한다. 잡 전체 env가 local이라
      # 이 스텝에서만 덮어써 supabase 분기(어댑터·미들웨어)가 실제로 컴파일되는지 검증한다.
      - name: Build (supabase adapter)
        run: pnpm build
        env:
          NEXT_PUBLIC_DATA_ADAPTER: supabase
      # mobile 프로젝트(iPhone 13)는 webkit 엔진이 기본이라 chromium만 설치하면 e2e가 깨진다.
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
